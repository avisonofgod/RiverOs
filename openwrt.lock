# RiverOs openwrt.lock — fija el arbol OpenWrt usado por el build
#
# Referencia estable: tag v25.12.0 de openwrt/openwrt (verificado 2026-08-30):
#   OPENWRT_COMMIT=4da53efc2fe744601e6189492dbd06b8930d72b8
# (tag v25.12.0^{} — 0e1f39e3... es el tag ligero)
#
# NOTA: el ImageBuilder local del proyecto se llama 25.12.5 (snapshot de
# trabajo sobre el release). Antes del primer build reproducible hay que
# mapear el commit exacto del arbol que genera 25.12.5:
#   git -C openwrt log --oneline -1   # tras checkout del commit candidato
# y comparar bin/ vs el bin GOOD (manifest + sha256).
#
# Formato:
#   OPENWRT_COMMIT=<sha256 del tag>
#   OPENWRT_VERSION=25.12.0   # (o 25.12.5 snapshot)
#   KERNEL_VERSION=6.12.94
#   FEEDS_PACKAGES=<sha del feed packages>
#   FEEDS_ROUTING=<sha o disabled>
#   FEEDS_LUCI=<sha o disabled>
#   FEEDS_TELEPHONY=<sha o disabled>
#
# Regla: NO compilar contra master/main; siempre un commit concreto.
OPENWRT_COMMIT=4da53efc2fe744601e6189492dbd06b8930d72b8
OPENWRT_VERSION=25.12.0
KERNEL_VERSION=6.12.94
FEEDS_PACKAGES=disabled
FEEDS_ROUTING=disabled
FEEDS_LUCI=disabled
FEEDS_TELEPHONY=disabled
