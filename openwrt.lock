# RiverOs openwrt.lock — fija el arbol OpenWrt usado por el build
#
# Referencia: commit de openwrt/openwrt que define kernel 6.12.94 (el del IB
# 25.12.5 del proyecto — snapshot de master, NO tag v25.12.0 que usa 6.12.71):
#   git log --all --oneline -S 'LINUX_VERSION-6.12 = .94' -- target/linux/generic/kernel-6.12
#   -> 6bad5f2050 "kernel: bump 6.12 to 6.12.94" (verificado 2026-08-30)
#   LINUX_KERNEL_HASH-6.12.94 = e998a232b9418db3301cb58468e291a4f41d6ab8306029b30d991f56251dc8d2
#
# NOTA: el tag v25.12.0 (4da53ef) usa kernel 6.12.71 — NO reproduce el IB.
# master actual usa 6.12.107.
#
# Formato:
#   OPENWRT_COMMIT=<sha256 del commit>
#   OPENWRT_VERSION=25.12.5-snapshot
#   KERNEL_VERSION=6.12.94
#   FEEDS_PACKAGES=<sha del feed packages>
#   FEEDS_ROUTING=<sha o disabled>
#   FEEDS_LUCI=<sha o disabled>
#   FEEDS_TELEPHONY=<sha o disabled>
#
# Regla: NO compilar contra master/main; siempre un commit concreto.
OPENWRT_COMMIT=6bad5f2050
OPENWRT_VERSION=25.12.5-snapshot
KERNEL_VERSION=6.12.94
FEEDS_PACKAGES=disabled
FEEDS_ROUTING=disabled
FEEDS_LUCI=disabled
FEEDS_TELEPHONY=disabled
